<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - Video Zone</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            color: #f8fafc;
        }
        .timer-box {
            margin: 25px 0;
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
        }
        .seconds {
            font-size: 26px;
            color: #f43f5e;
        }
        .btn {
            display: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .ad-space {
            margin: 20px 0;
            padding: 15px;
            background-color: #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #38bdf8;
            cursor: pointer;
            border: 1px dashed #64748b;
            transition: background 0.2s;
        }
        .ad-space:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Your Video Is Ready</h2>

        <!-- Adsterra Smartlink Ad Box -->
        <div class="ad-space" onclick="openAdLink()">
            <span>⚡ Click here to unlock high speed server (Sponsor Ad)</span>
        </div>

        <div class="timer-box" id="timer-box">
            Please wait <span class="seconds" id="count">15</span> seconds...
        </div>

        <a id="get-video-btn" class="btn" href="#">▶️ Click Here To Get Video</a>
    </div>

    <script>
        const SMARTLINK = "https://www.profitableratecpmnetwork.com/fbwe8y4d?key=968ce280a889c90aee6bd179f64e4a21";
        const BOT_USERNAME = "Nexxa18Bot";

        // URL માંથી '?go=get_xxx' પેરામીટર રીડ કરવું
        const urlParams = new URLSearchParams(window.location.search);
        const videoParam = urlParams.get('go');

        // બોટની યોગ્ય લિંક સેટ કરવી
        const botRedirectUrl = videoParam 
            ? `https://t.me/${BOT_USERNAME}?start=${videoParam}`
            : `https://t.me/${BOT_USERNAME}`;

        let timeLeft = 15;
        const countSpan = document.getElementById("count");
        const timerBox = document.getElementById("timer-box");
        const videoBtn = document.getElementById("get-video-btn");

        videoBtn.href = botRedirectUrl;

        // Smartlink ઓપન કરવાનું ફંક્શન
        function openAdLink() {
            window.open(SMARTLINK, "_blank");
        }

        // ૧૫ સેકન્ડનું કાઉન્ટડાઉન
        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countSpan.innerText = timeLeft;
            } else {
                clearInterval(countdown);
                timerBox.style.display = "none";
                videoBtn.style.display = "inline-block";
            }
        }, 1000);
    </script>

</body>
</html>
