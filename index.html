<body>

    <!-- 1. FULL PAGE OVERLAY CONTENT LOCKER (FIRST SCREEN) -->

    <!-- 2. MAIN WEBSITE CONTENT (UNLOCKED AFTER STEP 1) -->
    <div class="ad-slot-top" id="slot-top"></div>

    <div class="card">
        <div class="card-header">
            <h2>🎬 Video Ready</h2>
            <div class="timer-badge" id="timerBadge">⚡ Checking: <span id="count">15</span>s</div>
        </div>

        <!-- Robot Verification Box -->
        <div class="captcha-box" id="captcha-trigger">
            <div class="captcha-left">

                <span class="captcha-text">I'm not a robot / Verify Human</span>

            <div class="captcha-right">

                <span class="captcha-brand">reCAPTCHA</span>

        </div>

        <!-- Main Button with 3s Auto-Redirect -->
        <button id="get-video-btn" class="btn-locked" disabled>
            <span id="btnIcon">🔒</span>
            <span id="btnText">Please Wait (15s)</span>
        </button>

    <div class="ad-slot-bottom" id="slot-bottom"></div>

    <script>
        const SMARTLINK = "https://onepyrincehyarey.org?iFQO5=1161683";
        const BOT_USERNAME = "Nexxa18Bot";

        const urlParams = new URLSearchParams(window.location.search);
        const videoParam = urlParams.get('go');

        const botRedirectUrl = videoParam 
            ? `https://t.me/${BOT_USERNAME}?start=${videoParam}`
            : `https://t.me/${BOT_USERNAME}`;

        let timeLeft = 15;
        let isTimerDone = false;
        let isRedirectTriggered = false;

        const lockerOverlay = document.getElementById("locker-overlay");
        const unlockNowBtn = document.getElementById("unlock-now-btn");
        const countSpan = document.getElementById("count");
        const timerBadge = document.getElementById("timerBadge");
        const videoBtn = document.getElementById("get-video-btn");
        const btnIcon = document.getElementById("btnIcon");
        const btnText = document.getElementById("btnText");
        const fakeCheck = document.getElementById("fakeCheck");

        function openSmartlinkWindow() {
            const tempLink = document.createElement('a');
            tempLink.href = SMARTLINK;
            tempLink.target = '_blank';
            tempLink.rel = 'noopener noreferrer';
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
        }

        // STEP 1: Unlock full-page screen overlay & trigger ad
        unlockNowBtn.addEventListener("click", function() {
            openSmartlinkWindow();
            lockerOverlay.style.display = "none";
            startPageCountdown();
        });

        // Robot verification triggers smartlink in background
        document.getElementById("captcha-trigger").addEventListener("click", function() {
            fakeCheck.classList.add("checked");
            openSmartlinkWindow();
        });

        // STEP 2: 15-second timer starts after overlay is unlocked
        function startPageCountdown() {
            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countSpan.innerText = timeLeft;
                    if (!isTimerDone) {
                        btnText.innerText = `Please Wait (${timeLeft}s)`;
                    }
                } else {
                    clearInterval(countdown);
                    isTimerDone = true;
                    timerBadge.innerHTML = "✅ <span style='color:#10b981;'>Ready</span>";
                    videoBtn.disabled = false;
                    videoBtn.className = "btn-unlocked";
                    btnIcon.innerText = "📥";
                    btnText.innerText = "Get Video On Telegram";
                }
            }, 1000);
        }

        // STEP 3: Click button -> open smartlink & 3-second auto-redirect to bot
        videoBtn.addEventListener("click", function(e) {
            e.preventDefault();
            if (!isTimerDone || isRedirectTriggered) return;

            isRedirectTriggered = true;

            // Open Smartlink
            openSmartlinkWindow();

            // 3-second auto-redirect
            let redirectSeconds = 3;
            videoBtn.className = "btn-redirecting";
            btnIcon.innerText = "⏳";
            btnText.innerText = `Opening Telegram in ${redirectSeconds}s...`;

            const redirectInterval = setInterval(() => {
                redirectSeconds--;
                if (redirectSeconds > 0) {
                    btnText.innerText = `Opening Telegram in ${redirectSeconds}s...`;
                } else {
                    clearInterval(redirectInterval);
                    btnText.innerText = "Redirecting...";
                    window.location.href = botRedirectUrl;
                }
            }, 1000);
        });

        // Top 320x50 Banner
        function injectTopBanner() {
            const container = document.getElementById("slot-top");
            if (!container) return;
            const iframe = document.createElement('iframe');
            iframe.width = "320";
            iframe.height = "50";
            iframe.frameBorder = "0";
            iframe.scrolling = "no";
            container.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <body style="margin:0;padding:0;display:flex;justify-content:center;align-items:center;">
                <script type="text/javascript">
                    atOptions = {
                        'key' : '528c4991011313c6603d9e76df6c8170',
                        'format' : 'iframe',
                        'height' : 50,
                        'width' : 320,
                        'params' : {}
                    };
                <\/script>
                <script type="text/javascript" src="https://www.highrevenueformat.com/528c4991011313c6603d9e76df6c8170/invoke.js"><\/script>
                </body>
            `);
            doc.close();
        }

        // Bottom 300x250 Banner
        function injectBottomBanner() {
            const container = document.getElementById("slot-bottom");
            if (!container) return;
            const iframe = document.createElement('iframe');
            iframe.width = "300";
            iframe.height = "250";
            iframe.frameBorder = "0";
            iframe.scrolling = "no";
            container.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <body style="margin:0;padding:0;display:flex;justify-content:center;align-items:center;">
                <script type="text/javascript">
                    atOptions = {
                        'key' : '3c5d38e6483721d34d6711714b85f53c',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                    };
                <\/script>
                <script type="text/javascript" src="https://www.highrevenueformat.com/3c5d38e6483721d34d6711714b85f53c/invoke.js"><\/script>
                </body>
            `);
            doc.close();
        }

        window.addEventListener('DOMContentLoaded', () => {
            injectTopBanner();
            setTimeout(injectBottomBanner, 400);
        });
    </script>
