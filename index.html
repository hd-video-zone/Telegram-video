<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HD Video Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #151c2c;
      border: 1px solid #28344e;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    .heading {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #38bdf8;
    }
    .subtext {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    /* Fake Video Player લુક */
    .fake-player {
      position: relative;
      background: #000;
      height: 190px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
      border: 1px dashed #334155;
      margin-bottom: 15px;
    }
    .play-btn {
      width: 55px;
      height: 55px;
      background: rgba(0, 136, 204, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 15px rgba(0, 136, 204, 0.6);
    }
    .ad-banner {
      min-height: 50px;
      margin: 12px 0;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
    }
    .timer-text {
      font-size: 15px;
      margin: 15px 0;
      color: #f1f5f9;
    }
    .timer-num {
      color: #f43f5e;
      font-weight: bold;
      font-size: 18px;
    }
    .btn {
      display: none;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #0088cc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    .direct-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #fbbf24;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="heading">Aapka Video Ready Ho Raha Hai...</div>
  <div class="subtext">Please wait for the secure download link</div>

  <!-- Fake Video Player: ક્લિક કરવાથી Adsterra Direct Link ખુલશે -->
  <div class="fake-player" onclick="openDirectAd()">
    <div class="play-btn">▶</div>
    <span style="font-size: 12px; margin-top: 8px; color: #cbd5e1;">Click here to Play / Unmute</span>
  </div>

  <!-- Adsterra Banner Ad #1 -->
  <div class="ad-banner">
    <!-- Adsterra Banner Script 1 મુકો -->
  </div>

  <p class="timer-text" id="timer-box">
    Link unlock hone me <span class="timer-num" id="sec">15</span> seconds baki hai...
  </p>

  <button class="btn" id="go-btn" onclick="openTelegram()">
    🚀 Watch Full Video on Telegram
  </button>

  <!-- Adsterra Direct Link -->
  <a class="direct-link" href="https://YOUR_ADSTERRA_DIRECT_LINK" target="_blank">
    Server 2: Fast High-Speed Stream
  </a>

  <!-- Adsterra Banner Ad #2 -->
  <div class="ad-banner">
    <!-- Adsterra Banner Script 2 મુકો -->
  </div>
</div>

<script>
  let seconds = 15; // 15 સેકન્ડ ટાઈમર
  const timerBox = document.getElementById("timer-box");
  const secElement = document.getElementById("sec");
  const goBtn = document.getElementById("go-btn");

  const countdown = setInterval(() => {
    seconds--;
    secElement.innerText = seconds;

    if (seconds <= 0) {
      clearInterval(countdown);
      timerBox.style.display = "none";
      goBtn.style.display = "block";
    }
  }, 1000);

  function openDirectAd() {
    // Fake player પર ક્લિક કરે ત્યારે Direct Link ખુલશે
    window.open("https://YOUR_ADSTERRA_DIRECT_LINK", "_blank");
  }

  function openTelegram() {
    // અહીં તમારી Telegram Channel/Video લિંક મુકો
    window.location.href = "https://t.me/YOUR_CHANNEL_OR_POST_LINK";
  }
</script>

</body>
</html>
