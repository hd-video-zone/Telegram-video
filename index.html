    <style>
        body {

        .ad-slot-top, .ad-slot-bottom {

        .card {
            background-color: #161f30;
            border-radius: 18px;
            padding: 25px 20px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);

        h2 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #f8fafc;
        }

        .play-clickbait-box {
            margin: 18px 0;
            padding: 16px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.35));
            border: 2px solid #ef4444;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            animation: pulse-glow 1.8s infinite;
        }

        .play-clickbait-box:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.5));
        }

        .play-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .play-sub {
            font-size: 12px;
            color: #fca5a5;
            margin-top: 4px;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .timer-box {
            margin: 18px 0;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            border-radius: 8px;
            border: 1px dashed rgba(56, 189, 248, 0.4);
            cursor: pointer;
        }

        .seconds {
            font-size: 24px;
            color: #f43f5e;
            font-weight: bold;
        }

        .btn {
            display: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn-second-step {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5) !important;

</head>

    <script>
        const SMARTLINK = "https://www.profitableratecpmnetwork.com/fbwe8y4d?key=968ce280a889c90aee6bd179f64e4a21";
        const BOT_USERNAME = "Nexxa18Bot";

        const urlParams = new URLSearchParams(window.location.search);
        const videoParam = urlParams.get('go');

        const botRedirectUrl = videoParam 
            ? `https://t.me/${BOT_USERNAME}?start=${videoParam}`
            : `https://t.me/${BOT_USERNAME}`;

        let timeLeft = 20; // ૨૦ સેકન્ડ સેટ કરેલ છે
        let isSmartlinkTriggered = false;

        const countSpan = document.getElementById("count");
        const timerBox = document.getElementById("timer-trigger");
        const videoBtn = document.getElementById("get-video-btn");

        function openSmartlink() {
            window.open(SMARTLINK, "_blank");
        }

        document.getElementById("play-trigger").addEventListener("click", openSmartlink);
        document.getElementById("timer-trigger").addEventListener("click", openSmartlink);

        videoBtn.addEventListener("click", function(e) {
            e.preventDefault();

            if (!isSmartlinkTriggered) {
                openSmartlink();
                isSmartlinkTriggered = true;
                videoBtn.classList.add("btn-second-step");
                videoBtn.innerHTML = "🚀 Click Here to Open Bot";
            } else {
                window.location.href = botRedirectUrl;
            }
        });

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countSpan.innerText = timeLeft;
            } else {
                clearInterval(countdown);
                timerBox.style.display = "none";
                videoBtn.style.display = "inline-block";
            }
        }, 1000);

        // Fast Load (Lazy loading scripts)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const popScript = document.createElement('script');
                popScript.src = "https://pl31296521.profitableratecpmnetwork.com/91/ec/05/91ec0584ed1776af17133dac80599f31.js";

                document.body.appendChild(socialScript);
            }, 600);
        });
